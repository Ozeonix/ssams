# ─────────────────────────────────────────────────────────────────────────────
# SSAMS / ARTMS  –  Production Docker Compose
# Features:
#   • Isolated internal networks (no public ports on internal services)
#   • Nginx ingress on ports 80/443 only
#   • Resource limits for each service
#   • Healthchecks + restart policies
#   • Named volumes with backup labels
# Usage:
#   cp .env.production .env
#   docker compose -f docker-compose.production.yml up -d
# ─────────────────────────────────────────────────────────────────────────────
version: "3.9"

# ── Shared extension ─────────────────────────────────────────────────────────
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

x-restart: &default-restart
  restart: unless-stopped

services:

  # ──────────────────────────────────────────────────────────────────────────
  # Nginx Ingress  (only service with public ports)
  # ──────────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: artms-nginx
    <<: *default-restart
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    networks:
      - ingress_net
      - api_net
      - admin_net
    depends_on:
      api:
        condition: service_healthy
      admin-web:
        condition: service_started
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  # ──────────────────────────────────────────────────────────────────────────
  # Certbot  (TLS certificate renewal – ephemeral)
  # ──────────────────────────────────────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: artms-certbot
    volumes:
      - nginx_ssl:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - ingress_net
    profiles: ["certbot"]   # run only when: docker compose --profile certbot up certbot
    command: >
      certonly --webroot
      --webroot-path=/var/www/certbot
      --email ${CERTBOT_EMAIL}
      --agree-tos --no-eff-email
      -d ${API_DOMAIN}
      -d ${ADMIN_DOMAIN}

  # ──────────────────────────────────────────────────────────────────────────
  # PostgreSQL  (internal only – no published port)
  # ──────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: artms-prod-postgres
    <<: *default-restart
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - db_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  # ──────────────────────────────────────────────────────────────────────────
  # PgBouncer Connection Pooler (Transaction Pooling for 50k Concurrent Users)
  # ──────────────────────────────────────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: artms-prod-pgbouncer
    <<: *default-restart
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 10000
      DEFAULT_POOL_SIZE: 50
    volumes:
      - ./infrastructure/docker/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    networks:
      - db_net
      - api_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 -U ${DB_USERNAME} -d ${DB_NAME} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ──────────────────────────────────────────────────────────────────────────
  # Redis  (internal only)
  # ──────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: artms-prod-redis
    <<: *default-restart
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
      --save 900 1
      --save 300 10
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - cache_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768M

  # ──────────────────────────────────────────────────────────────────────────
  # MinIO (S3 object storage – internal)
  # ──────────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: artms-prod-minio
    <<: *default-restart
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_VOLUMES:       "/data"
    volumes:
      - minio_data:/data
    networks:
      - storage_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # ──────────────────────────────────────────────────────────────────────────
  # ARTMS API  (Spring Boot)
  # ──────────────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend/ssama-api
      dockerfile: Dockerfile
      args:
        - MAVEN_OPTS=-XX:+TieredCompilation -XX:TieredStopAtLevel=1
    image: artms-api:${APP_VERSION:-latest}
    container_name: artms-prod-api
    <<: *default-restart
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE:    production
      DB_URL:                    jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME:               ${DB_USERNAME}
      DB_PASSWORD:               ${DB_PASSWORD}
      REDIS_HOST:                redis
      REDIS_PORT:                6379
      REDIS_PASSWORD:            ${REDIS_PASSWORD}
      S3_ENDPOINT:               http://minio:9000
      S3_BUCKET:                 ${S3_BUCKET}
      S3_ACCESS_KEY:             ${MINIO_ROOT_USER}
      S3_SECRET_KEY:             ${MINIO_ROOT_PASSWORD}
      JWT_SECRET:                ${JWT_SECRET}
      JWT_EXPIRY_SECONDS:        ${JWT_EXPIRY_SECONDS:-900}
      SWAGGER_ENABLED:           "false"
      LOG_LEVEL_APP:             ${LOG_LEVEL_APP:-WARN}
      JAVA_OPTS:                 "-XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Xmx768m -Xms256m"
    volumes:
      - api_storage:/app/storage
    networks:
      - api_net
      - db_net
      - cache_net
      - storage_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  # ──────────────────────────────────────────────────────────────────────────
  # Admin Web Portal
  # ──────────────────────────────────────────────────────────────────────────
  admin-web:
    build:
      context: ./admin/ssams-admin
      dockerfile: Dockerfile
    image: artms-admin:${APP_VERSION:-latest}
    container_name: artms-prod-admin-web
    <<: *default-restart
    networks:
      - admin_net
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    labels:
      com.ssams.backup: "true"
      com.ssams.service: "postgres"
  redis_data:
    labels:
      com.ssams.backup: "true"
      com.ssams.service: "redis"
  minio_data:
    labels:
      com.ssams.backup: "true"
      com.ssams.service: "minio"
  api_storage:
    labels:
      com.ssams.backup: "true"
      com.ssams.service: "api"
  nginx_ssl:
  nginx_logs:
  certbot_www:

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  ingress_net:
    driver: bridge
    internal: false
  api_net:
    driver: bridge
    internal: true
  admin_net:
    driver: bridge
    internal: true
  db_net:
    driver: bridge
    internal: true
  cache_net:
    driver: bridge
    internal: true
  storage_net:
    driver: bridge
    internal: true
