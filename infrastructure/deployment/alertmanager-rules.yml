# ─────────────────────────────────────────────────────────────────────────────
# Alertmanager Alert Rules – SSAMS / ARTMS
# ─────────────────────────────────────────────────────────────────────────────
groups:

  # ── API Availability ────────────────────────────────────────────────────────
  - name: api_availability
    interval: 30s
    rules:
      - alert: APIDown
        expr: up{job="artms-api"} == 0
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "ARTMS API is down"
          description: "The ARTMS API instance {{ $labels.instance }} has been unreachable for more than 1 minute."

      - alert: APIHighErrorRate
        expr: |
          rate(http_server_requests_seconds_count{job="artms-api",status=~"5.."}[5m])
          / rate(http_server_requests_seconds_count{job="artms-api"}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High 5xx error rate on ARTMS API"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes."

      - alert: APIHighLatency
        expr: |
          histogram_quantile(0.95,
            rate(http_server_requests_seconds_bucket{job="artms-api"}[5m])
          ) > 2
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "ARTMS API P95 latency > 2s"
          description: "P95 latency is {{ $value | humanizeDuration }} on {{ $labels.instance }}."

  # ── JVM / Memory ────────────────────────────────────────────────────────────
  - name: jvm_health
    rules:
      - alert: JVMHighHeapUsage
        expr: |
          jvm_memory_used_bytes{job="artms-api", area="heap"}
          / jvm_memory_max_bytes{job="artms-api", area="heap"} > 0.85
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "JVM heap usage > 85%"
          description: "JVM heap is at {{ $value | humanizePercentage }} on {{ $labels.instance }}."

      - alert: JVMGCPauseHigh
        expr: |
          rate(jvm_gc_pause_seconds_sum{job="artms-api"}[5m])
          / rate(jvm_gc_pause_seconds_count{job="artms-api"}[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "JVM GC pause average > 500ms"
          description: "Average GC pause on {{ $labels.instance }} is {{ $value | humanizeDuration }}."

  # ── Database ─────────────────────────────────────────────────────────────────
  - name: database_health
    rules:
      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL instance {{ $labels.instance }} is unreachable."

      - alert: PostgreSQLHighConnections
        expr: pg_stat_activity_count / pg_settings_max_connections > 0.80
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "PostgreSQL connection pool > 80%"
          description: "Connection usage is {{ $value | humanizePercentage }}."

      - alert: PostgreSQLReplicationLag
        expr: pg_replication_lag > 60
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "PostgreSQL replication lag > 60s"
          description: "Replication lag is {{ $value }}s on {{ $labels.instance }}."

      - alert: PostgreSQLLongRunningQuery
        expr: pg_stat_activity_max_tx_duration{datname!~"template.*|postgres"} > 300
        for: 2m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Long-running PostgreSQL query (>5 min)"
          description: "A query on {{ $labels.datname }} has been running for {{ $value | humanizeDuration }}."

  # ── Redis ────────────────────────────────────────────────────────────────────
  - name: redis_health
    rules:
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Redis is down"
          description: "Redis instance {{ $labels.instance }} is unreachable."

      - alert: RedisHighMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Redis memory usage > 85%"
          description: "Redis memory usage is {{ $value | humanizePercentage }}."

  # ── Host ─────────────────────────────────────────────────────────────────────
  - name: host_health
    rules:
      - alert: HighCPUUsage
        expr: |
          100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Host CPU usage > 85%"
          description: "CPU usage on {{ $labels.instance }} is {{ $value | humanize }}%."

      - alert: HighDiskUsage
        expr: |
          (node_filesystem_size_bytes{fstype!="tmpfs"} - node_filesystem_free_bytes{fstype!="tmpfs"})
          / node_filesystem_size_bytes{fstype!="tmpfs"} > 0.85
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Disk usage > 85%"
          description: "Disk {{ $labels.mountpoint }} on {{ $labels.instance }} is {{ $value | humanizePercentage }} full."

      - alert: CriticalDiskUsage
        expr: |
          (node_filesystem_size_bytes{fstype!="tmpfs"} - node_filesystem_free_bytes{fstype!="tmpfs"})
          / node_filesystem_size_bytes{fstype!="tmpfs"} > 0.95
        for: 1m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Disk usage > 95% – CRITICAL"
          description: "Disk {{ $labels.mountpoint }} on {{ $labels.instance }} is {{ $value | humanizePercentage }} full!"

      - alert: HighMemoryUsage
        expr: |
          (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes)
          / node_memory_MemTotal_bytes > 0.90
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Host memory usage > 90%"
          description: "Memory on {{ $labels.instance }} is at {{ $value | humanizePercentage }}."

  # ── SSL Certificates ──────────────────────────────────────────────────────────
  - name: ssl_certificates
    rules:
      - alert: SSLCertificateExpiringSoon
        expr: probe_ssl_earliest_cert_expiry - time() < 86400 * 14
        for: 6h
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "SSL certificate expiring in < 14 days"
          description: "Certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}."

      - alert: SSLCertificateExpired
        expr: probe_ssl_earliest_cert_expiry - time() <= 0
        for: 1m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "SSL certificate EXPIRED"
          description: "Certificate for {{ $labels.instance }} has expired!"
