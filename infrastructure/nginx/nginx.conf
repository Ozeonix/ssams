# ─────────────────────────────────────────────────────────────────────────────
# SSAMS / ARTMS  –  Nginx Ingress Reverse Proxy
# Features:
#   • HTTP → HTTPS redirect
#   • SSL/TLS termination (TLSv1.2 + TLSv1.3)
#   • WebSocket upgrade pass-through
#   • Ingress rate limiting (API + WebSocket)
#   • Gzip compression
#   • Security headers (HSTS, CSP, X-Frame-Options, …)
#   • Upstream health via /actuator/health
# ─────────────────────────────────────────────────────────────────────────────

worker_processes  auto;
worker_rlimit_nofile 131072;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 65535;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time us="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    # ── Performance & Buffers for 50k Users ────────────────────────────────────
    sendfile       on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout 75s;
    keepalive_requests 10000;
    types_hash_max_size 2048;
    server_tokens off;

    # High-throughput Proxy Buffers
    proxy_buffer_size 128k;
    proxy_buffers 16 128k;
    proxy_busy_buffers_size 256k;
    proxy_temp_file_write_size 256k;

    # ── Gzip compression ───────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/rss+xml application/atom+xml image/svg+xml
        application/x-font-ttf font/opentype application/vnd.ms-fontobject;

    # ── Rate-Limiting Zones (Scaled for 50k Active Users / NAT Gateways) ───────
    # General API – 100 req/s per IP (burst 200, no delay)
    limit_req_zone $binary_remote_addr zone=api_limit:20m      rate=100r/s;
    # Auth endpoints – 20 req/s per IP (burst 40, no delay)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m     rate=20r/s;
    # WebSocket connections – 50 per IP
    limit_conn_zone $binary_remote_addr zone=ws_conn_limit:20m;
    # Global connection limit per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:20m;

    limit_req_status  429;
    limit_conn_status 429;

    # ── Upstream: Spring Boot API (Pooled Keepalive for 50k CCU) ───────────────
    upstream artms_api {
        least_conn;
        server api:8080 max_fails=3 fail_timeout=30s;
        keepalive 256;
    }

    # ── Upstream: Admin Web Portal ─────────────────────────────────────────────
    upstream artms_admin {
        server admin-web:80;
        keepalive 64;
    }

    # ── Map: WebSocket upgrade detection ──────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # HTTP → HTTPS redirect (port 80)
    # ─────────────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ACME challenge (Let's Encrypt)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─────────────────────────────────────────────────────────────────────────
    # HTTPS – API
    # ─────────────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name api.ssams.local;          # ← replace with your domain

        # ── TLS ──────────────────────────────────────────────────────────────
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:
                            ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:
                            ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:
                            DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:20m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling        on;
        ssl_stapling_verify on;

        # ── Security headers ─────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    nosniff                                        always;
        add_header X-Frame-Options           DENY                                           always;
        add_header X-XSS-Protection          "1; mode=block"                                always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()"     always;

        # ── Connection limit ─────────────────────────────────────────────────
        limit_conn conn_limit 100;

        # ── Health check (no rate limit) ─────────────────────────────────────
        location = /actuator/health {
            proxy_pass         http://artms_api;
            proxy_set_header   Host $host;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            access_log off;
        }

        # ── Auth endpoints – rate limit with burst for 50k users ─────────────
        location ~ ^/api/v1/(auth|identity)/ {
            limit_req zone=auth_limit burst=40 nodelay;
            limit_req_log_level warn;

            proxy_pass         http://artms_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # ── WebSocket: /ws/** ────────────────────────────────────────────────
        location /ws/ {
            limit_conn ws_conn_limit 50;

            proxy_pass         http://artms_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── All other API requests ───────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=200 nodelay;
            limit_req_log_level warn;

            proxy_pass         http://artms_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;

            proxy_buffer_size          16k;
            proxy_buffers              4 32k;
            proxy_busy_buffers_size    64k;
        }

        # ── Swagger (disable in production via env) ───────────────────────────
        location /swagger-ui/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass         http://artms_api;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   Connection "";
        }

        # ── Default 404 ───────────────────────────────────────────────────────
        location / {
            return 404 '{"error":"not_found"}';
            add_header Content-Type application/json;
        }
    }

    # ─────────────────────────────────────────────────────────────────────────
    # HTTPS – Admin Portal
    # ─────────────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name admin.ssams.local;       # ← replace with your domain

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:
                            ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:
                            ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:
                            DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    nosniff                                        always;
        add_header X-Frame-Options           SAMEORIGIN                                     always;

        limit_conn conn_limit 50;

        location / {
            proxy_pass         http://artms_admin;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # Cache static assets aggressively
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                proxy_pass http://artms_admin;
                expires 30d;
                add_header Cache-Control "public, immutable";
            }
        }
    }
}
