# ─────────────────────────────────────────────────────────────────────────────
# PostgreSQL 16 – High-Concurrency Production Configuration (50k+ Users)
# Tuned for high read/write throughput with PgBouncer connection pooling
# Recommended Host Hardware: 8+ vCPU / 16GB-32GB RAM / Fast NVMe SSD
# ─────────────────────────────────────────────────────────────────────────────

# ── Connection & Limits ───────────────────────────────────────────────────────
max_connections                = 250            # Multiplexed via PgBouncer
superuser_reserved_connections = 5

# ── Memory & Caching ──────────────────────────────────────────────────────────
shared_buffers                 = 2GB            # Dedicated database buffer pool
effective_cache_size           = 6GB            # OS disk cache assumption for planner
work_mem                       = 32MB           # Per-operation sort & hash memory
maintenance_work_mem           = 512MB          # VACUUM, CREATE INDEX memory
wal_buffers                    = 32MB

# ── WAL & Checkpoints ─────────────────────────────────────────────────────────
wal_level                      = replica
max_wal_size                   = 8GB
min_wal_size                   = 512MB
checkpoint_completion_target   = 0.9            # Smooth disk write distribution
checkpoint_timeout             = 15min
synchronous_commit             = on

# ── Query Planner & Disk I/O ──────────────────────────────────────────────────
random_page_cost               = 1.1            # Fast NVMe SSD storage
effective_io_concurrency       = 250            # Concurrent disk requests
default_statistics_target      = 100

# ── Parallel Query Workers ────────────────────────────────────────────────────
max_worker_processes           = 8
max_parallel_workers           = 8
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4

# ── Defensive Timeouts for 50k Users ──────────────────────────────────────────
statement_timeout              = 30000          # Kill queries taking > 30s
lock_timeout                   = 10000          # Lock wait timeout 10s
idle_in_transaction_session_timeout = 15000     # Auto-abort transactions stuck > 15s
deadlock_timeout               = 1000           # Deadlock check interval 1s

# ── Logging & Auditing ────────────────────────────────────────────────────────
log_destination                = 'stderr'
logging_collector              = off
log_min_duration_statement     = 1000           # Log slow queries (> 1 sec)
log_checkpoints                = on
log_connections                = off
log_disconnections             = off
log_lock_waits                 = on
log_temp_files                 = 0              # Log all disk-spilling temp files
log_timezone                   = 'UTC'
log_line_prefix                = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# ── Autovacuum Tuning for Heavy Table Writes ───────────────────────────────────
autovacuum                     = on
autovacuum_max_workers         = 4
autovacuum_naptime             = 30s
autovacuum_vacuum_threshold     = 50
autovacuum_vacuum_scale_factor = 0.02           # More frequent vacuums on busy tables
autovacuum_analyze_scale_factor = 0.01          # Fast statistics updating

# ── Locale & Standards ────────────────────────────────────────────────────────
timezone                       = 'UTC'
datestyle                      = 'iso, mdy'
lc_messages                    = 'en_US.UTF-8'
lc_monetary                    = 'en_US.UTF-8'
lc_numeric                     = 'en_US.UTF-8'
lc_time                        = 'en_US.UTF-8'
default_text_search_config     = 'pg_catalog.english'
