;; ==============================================================================
;; SSAMS / ARTMS – High Concurrency PgBouncer Configuration (50k+ Users)
;; ==============================================================================

[databases]
* = host=postgres port=5432 auth_user=postgres

[pgbouncer]
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid

listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

;; Pool Mode: Transaction Pooling (Multiplexes 10,000+ client connections to 50 Postgres backends)
pool_mode = transaction

;; Connection Limits
max_client_conn = 10000
default_pool_size = 50
min_pool_size = 15
reserve_pool_size = 20
reserve_pool_timeout = 5.0
max_db_connections = 100

;; Timeouts (in seconds)
server_reset_query = DISCARD ALL
server_check_query = select 1
server_check_delay = 30
query_timeout = 60.0
query_wait_timeout = 15.0
client_idle_timeout = 120.0
server_idle_timeout = 600.0
server_lifetime = 3600.0

;; TCP & Buffer Settings for High Throughput
pkt_buf = 4096
max_packet_size = 2147483647
tcp_defer_accept = 1
tcp_socket_buffer = 0
tcp_keepalive = 1
tcp_keepcnt = 5
tcp_keepidle = 30
tcp_keepintvl = 10

;; Logging
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60
